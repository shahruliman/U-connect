<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>U CONNECT</title>
  <link rel="stylesheet" href="../css/myticket-detail.css">
</head>
<body>

  <!-- Sticky Glass Navbar -->
  <header class="nav">
    <div class="nav-brand">
      <a href="#">U CONNECT</a>
    </div>
    <ul class="nav-links">
      <li><a href="#">Home</a></li>
      <li><a href="event.html">Events</a></li>
      <li><a href="myticket.html">My Ticket</a></li>
    </ul>

    <div class="nav-logout">
      <a href="index.html" class="btn-logout">Logout</a>
    </div>
  </header>

  

<!-- Upcoming Events Section -->
<section class="upcoming-section">
  <div class="upcoming-header">
    <div>
      <h2>Upcoming Events</h2>
      <p>Explore upcoming workshops, hackathons, and campus activities</p>
    </div>
  </div>

  <!-- Content Layout: Left Ticket + Right Square Event Box -->
  <div class="upcoming-content-layout">
    
    <!-- Left Area: Featured Vertical Ticket Card -->
    <div class="featured-ticket-card">
      <div class="ticket-top">
        <div class="ticket-logo">U CONNECT</div>
        <div class="ticket-badge-triangle">▲</div>
      </div>
      
      <div class="ticket-title-group">
        <span class="ticket-title-line1">Hackathon :Code for Campus</span>
        <span class="ticket-title-line2">2026</span>
      </div>

      <div class="ticket-info-block">
        <p class="ticket-location">CAMPUS AUDITORIUM</p>
        <p class="ticket-date">07 NOV 2026</p>
        <p class="ticket-day">SATURDAY</p>
        <p class="ticket-time">08:30 AM ONWARDS</p>
      </div>

      <div class="ticket-divider-notch"></div>

      <div class="ticket-bottom">
        <div class="ticket-rsvp-text">
          <span>RSVP</span>
          <span>NOW</span>
        </div>
        <div class="ticket-circles">
          <div class="circle-outline"></div>
          <div class="circle-solid"></div>
        </div>
      </div>
    </div>

</section>

 

</body>
</html>
