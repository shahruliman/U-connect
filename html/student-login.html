<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>U-CONNECT - Student Login</title>
    <link rel="stylesheet" href="../css/login.css">
</head>
<body>

    <div class="split-container">
        
        <!-- Left Panel (Brand / Info) -->
        <div class="left-panel student-bg">
            <div class="brand-badge">U-CONNECT</div>
            <h1>Your seat is waiting.</h1>
            <p>Book workshops and club events in seconds. If an event is full, join the waitlist and we automatically upgrade you the moment a seat opens.</p>
        </div>

        <!-- Right Panel (Login Form) -->
        <div class="right-panel">
            <div class="form-box">
                <h2>Student Login</h2>
                <p class="subtitle">Enter your credentials to access your account.</p>

                <!-- Static form for storyboard demonstration -->
                 <form action="homepage.html" method="GET">
                    <div class="input-group">
                        <label> Username</label>
                        <input type="text" placeholder="e.g. student123" required>
                    </div>

                     <div class="input-group">
                        <label>Password</label>
                        <input type="password" placeholder="••••••••" required>
                    </div>
                    
                    <button type="submit" class="submit-btn admin-btn">Log in as Student</button>
                </form>

                <div class="footer-links">
                    Are you an admin? <a href="admin-login.html">Log in here</a><br>
                    New here? <a href="register.html">Create an account</a>
                </div>
            </div>
        </div>

    </div>

</body>
</html>
